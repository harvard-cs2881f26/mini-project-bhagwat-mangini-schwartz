<!doctype html><html><head><meta charset="utf-8"><title>Draft preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>*{box-sizing:border-box}p,h1,h2,h3,ul,ol,table{margin:0}table{border-collapse:collapse}td,th{padding:0}html,body{margin:0;background:#2b2b2b;overflow:hidden}#stage{width:1920px;height:1080px;transform-origin:0 0;position:relative}
#stage>section{position:relative;width:1920px;height:1080px;box-sizing:border-box}</style></head><body>
<div id="stage"></div>
<script>
var id=location.hash.slice(1)||"fig4";
fetch(id+".html?t="+Date.now()).then(r=>r.text()).then(t=>{var s=document.getElementById("stage");s.innerHTML=t;s.querySelectorAll("aside").forEach(a=>a.remove());fit();});
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById("stage").style.transform="scale("+k+")";}
addEventListener("resize",fit);addEventListener("hashchange",()=>location.reload());
</script></body></html>
