# Fig. 4 reproduction (text). Owner: Noa.
# Decisions behind every setting are in WORKLOG.md (2026-10-12). One run name = one config:
# This is the thinking: default twin of configs/repro_fig4.yaml; everything else is identical.
run: repro_fig4_default
benchmark: text
prompt: text_verbatim   # the dataset's prompt, unchanged (src/asimov/bench/text.py)
thinking: default       # the provider decides (no reasoning parameter sent); repro_fig4 is the min run
log_reasoning: true     # save reasoning/thought summaries in each reply's `reasoning` field (never scored)
models:
  - {name: GPT-5 Nano,            provider: openai,    model: gpt-5-nano}
  - {name: GPT-5 Mini,            provider: openai,    model: gpt-5-mini}
  - {name: GPT-5,                 provider: openai,    model: gpt-5}
  - {name: Claude Sonnet 4 (4.5), provider: anthropic, model: claude-sonnet-4-5-20250929}  # stand-in
  - {name: Claude Opus 4.1 (4.5), provider: anthropic, model: claude-opus-4-5-20251101}    # stand-in
  - {name: Gemini 2.5 Flash-Lite (3.1), provider: gemini, model: gemini-3.1-flash-lite}    # stand-in
  - {name: Gemini 2.5 Flash (3),        provider: gemini, model: gemini-3-flash-preview}   # stand-in
  - {name: Gemini 2.5 Pro (3.1),        provider: gemini, model: gemini-3.1-pro-preview}   # stand-in
