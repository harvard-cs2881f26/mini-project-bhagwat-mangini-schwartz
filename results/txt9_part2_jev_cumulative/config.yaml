# Variant of part2_jev.yaml with one change: prompt decision_short -> decision_short_cumulative
# (one call per question; each state adds the model's own earlier picks).
run: part2_jev_cumulative
benchmark: text
prompt: decision_short_cumulative
thinking: min
models:
  - {name: Jev, provider: systemone, model: jev-latest, base_url: "https://api.typesafe.ai", key_env: TYPESAFE_API_KEY}
