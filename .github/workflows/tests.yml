# Free checks on every PR and every push to main: no API keys, no network calls to model
# providers, no data download. Runs on the committed 5-item sample in tests/fixtures/data.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASIMOV_DATA_DIR: tests/fixtures/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: python -m pytest -rs
      - name: Mock run through the CLI (free, no keys)
        run: python scripts/run.py configs/smoke_mock.yaml
