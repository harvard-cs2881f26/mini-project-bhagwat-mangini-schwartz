# Free end-to-end check of the decision interface (Part 2): no API keys, no network. The mocks
# answer from the options alone (no answer key), so accuracy is meaningless; what's checked is
# that every item yields a DecisionPart, a 4-letter reply and saved probabilities.
run: smoke_mock_decision
benchmark: text
prompt: decision_full
thinking: min
models:
  - {name: Decide first option, provider: mock_decision, model: mock-decide-first}
  - {name: Decide uniform,      provider: mock_decision, model: mock-decide-uniform}
