# Variant of part2_codiv.yaml (Laya row only, not OpenJev) with one change: prompt decision_short ->
# decision_short_cumulative. Codiv: run with --workers 1 (60 requests/min).
run: part2_laya_cumulative
benchmark: text
prompt: decision_short_cumulative
thinking: min
models:
  - {name: Laya, provider: systemone, model: laya-1.0, base_url: "https://api.codiv.ai", key_env: CODIV_API_KEY}
