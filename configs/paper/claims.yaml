headline:
- id: headline_frontier_recognise_risks
  check: close_to_paper
  section: '3'
  quote: on the task of recognizing latent risk types in (text) scenarios, GPT5, Gemini 2.5 Pro and Claude Opus 4.1 all score
    above 90%
  models:
  - GPT5
  - Gemini 2.5 Pro
  - Claude Opus 4.1
  note: 'Also: severity average 88.7% for the same three models (see sec3 claims).'
- id: headline_small_models_lag
  check: size_gap
  section: '3'
  quote: the faster/nano versions of these models show considerable drop in performance
  pairs:
  - - GPT5
    - GPT5-Mini
  - - GPT5
    - GPT5-Nano
  - - Claude Opus 4.1
    - Claude Sonnet 4
  - - Gemini 2.5 Pro
    - Gemini 2.5 Flash
  note: 'Pairs per text: GPT5 vs GPT5-Mini/GPT5-Nano; Claude Sonnet 4 and Gemini 2.5 Flash ''also have a gap, albeit smaller''
    vs their larger counterparts. Gemini 2.5 Flash-Lite is plotted in Fig 4 but not named in this paragraph (named as weaker
    in the Action Safety paragraph). Intro calls this a ''latency gap''. Pairs set by Claude (main session) from the paper''s
    pairing: each small model vs its own family''s large model.'
- id: headline_actions_harder
  check: actions_harder
  section: '3'
  quote: accuracy in evaluating whether an action is safe ... and post-action activated risk assessment ... is generally lower
    than scenario-only risk and severity accuracies
  note: 'Compares Fig 4b (effect, activated risk) with Fig 4a (latent risk, severity). Text adds: ''Except for Gemini 2.5
    Flash'', smaller models are substantially weaker, naming GPT-5-Mini, GPT-5-Nano and Gemini 2.5 Flash-lite.'
