# Variant of part2_openjev_full.yaml (OpenJev think 0 only) with one change:
# prompt decision_full -> decision_full_cumulative. Codiv: run with --workers 1 (60 requests/min).
run: part2_openjev_full_cumulative
benchmark: text
prompt: decision_full_cumulative
thinking: min
models:
  - {name: OpenJev (think 0), provider: systemone, model: openjev-latest, base_url: "https://api.codiv.ai",
     key_env: CODIV_API_KEY, params: {think: 0}}
