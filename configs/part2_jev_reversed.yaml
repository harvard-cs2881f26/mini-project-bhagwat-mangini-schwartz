# Part 2: Jev with every question's options sent in reverse order, to measure its documented
# lean toward the first option (docs.typesafe.ai/model-jaggedness/jev-1.13). Compare per item
# with part2_jev. Own run name: results folders are keyed by model id.
# Question mode: change prompt to decision_short_chained or decision_short_cumulative (new run name).
run: part2_jev_reversed
benchmark: text
prompt: decision_short
thinking: min
models:
  - {name: Jev (reversed options), provider: systemone, model: jev-latest, base_url: "https://api.typesafe.ai",
     key_env: TYPESAFE_API_KEY, params: {option_order: reversed}}
