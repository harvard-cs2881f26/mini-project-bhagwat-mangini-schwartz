[project]
name = "asimov"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Dev checks (requirements-dev.txt; pyright via `npx pyright`). The Stop hook runs them on the
# files a branch adds or changes; a repo-wide `ruff format` is a separate, team-agreed commit.
[tool.ruff]
line-length = 130  # existing modules run long; format only touches new files
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
